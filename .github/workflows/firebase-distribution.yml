name: Firebase App Distribution

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  firebase_distribution:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK Debug
        run: flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-firebase
          path: build/app/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Uncomment below when ready for release builds with Firebase
      # - name: Upload to Firebase App Distribution
      #   uses: wzieba/Firebase-Distribution-Github-Action@v1
      #   with:
      #     appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
      #     serviceCredentialsFile: service-account-key.json
      #     file: build/app/outputs/apk/debug/app-debug.apk
      #     releaseNotes: "Debug Build - ${{ github.sha }}"
      #     groups: testers

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Debug APK built - download from Actions artifacts'
            })
